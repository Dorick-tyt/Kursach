[project]
name = "pythonkurcovaya"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "mypy>=1.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "types-requests>=2.33.0.20260408",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
[black]
max-line-length = 119
exclude = ".git"

[isort]
max-line-length = 119

[mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".venv"

[tool.mypy]
python_version = "3.9"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true



# Отключаем проверку типов для декораторов
disable_error_code = [
    "type-arg",
    "untyped-decorator",
    "no-untyped-def"
]
